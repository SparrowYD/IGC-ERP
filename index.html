                category: '표준규격',
                size: '2.5 MB',
                uploadDate: '2026-01-15',
                uploadedBy: '공길택',
                description: 'ISO 9001 품질경영시스템 표준',

        function Main() {
            const [currentUser, setCurrentUser] = useState(null);
            const [employees, setEmployees] = useState(initialEmployees);
            const [isInitialized, setIsInitialized] = useState(false);

            // Firestore에서 직원 데이터 불러오기 및 실시간 동기화
            useEffect(() => {
                const unsubscribe = db.collection('employees').onSnapshot((snapshot) => {
                    if (snapshot.empty) {
                        // 처음 사용 시 초기 데이터 저장
                        initialEmployees.forEach(emp => {
                            db.collection('employees').doc(emp.id.toString()).set(emp);
                        });
                        setEmployees(initialEmployees);
                    } else {
                        const employeesData = snapshot.docs.map(doc => ({
                            id: parseInt(doc.id),
                            ...doc.data()
                        }));
                        setEmployees(employeesData.sort((a, b) => a.id - b.id));
                    }
                    setIsInitialized(true);
                });

                return () => unsubscribe();
            }, []);

            const updateEmployeePassword = (employeeId, newPassword) => {
                const updatedEmployees = employees.map(emp => 
                    emp.id === employeeId ? { ...emp, password: newPassword } : emp
                );
                setEmployees(updatedEmployees);
                
                // Firestore에 저장
                db.collection('employees').doc(employeeId.toString()).update({
                    password: newPassword
                });
            };

            const updateEmployeeRole = (employeeId, newRole) => {
                const updatedEmployees = employees.map(emp => 
                    emp.id === employeeId ? { ...emp, role: newRole } : emp
                );
                setEmployees(updatedEmployees);
                
                // Firestore에 저장
                db.collection('employees').doc(employeeId.toString()).update({
                    role: newRole
                });
                
                // 현재 로그인한 사용자의 권한이 변경된 경우 currentUser도 업데이트
                if (currentUser && currentUser.id === employeeId) {
                    setCurrentUser({ ...currentUser, role: newRole });
                }
            };

            if (!isInitialized) {
                return (
                    <div style={{
                        display: 'flex',
                        justifyContent: 'center',
                        alignItems: 'center',
                        minHeight: '100vh',
                        fontSize: '18px',
                        color: '#666'
                    }}>
                        🔄 시스템 로딩 중...
                    </div>
                );
            }

            if (!currentUser) {
                return <LoginScreen employees={employees} onLogin={setCurrentUser} />;
            }

            return (
                <ERPSystem 
                    currentUser={currentUser} 
                    onLogout={() => setCurrentUser(null)}
                    employees={employees}
                    updateEmployeePassword={updateEmployeePassword}
                    updateEmployeeRole={updateEmployeeRole}
                />
            );
        }

                        <p style={{
                            textAlign: 'center',

                            color: '#7f8c8d',

                        }}>

                        </p>

        }

        function ERPSystem({ currentUser, onLogout, employees, updateEmployeePassword, updateEmployeeRole }) {

        function ScheduleTab({ currentUser, sharedSchedules, setSharedSchedules }) {
            const [currentDate, setCurrentDate] = useState(new Date(2026, 0, 1));
            const [employees, setEmployees] = useState(initialEmployees);
            const schedules = sharedSchedules; // 공유 일정 사용
            const setSchedules = setSharedSchedules; // 공유 일정 setter 사용
            const [scheduleModalOpen, setScheduleModalOpen] = useState(false);
            const [employeeModalOpen, setEmployeeModalOpen] = useState(false);
            const [selectedCell, setSelectedCell] = useState(null);
            const tableRef = useRef(null);

            // 드래그 스크롤 기능
            useEffect(() => {
                const table = tableRef.current;
                if (!table) return;

                let isDown = false;
                let startX;
                let scrollLeft;

                const handleMouseDown = (e) => {
                    isDown = true;
                    startX = e.pageX - table.offsetLeft;
                    scrollLeft = table.scrollLeft;
                };

                const handleMouseLeave = () => {
                    isDown = false;
                };

                const handleMouseUp = () => {
                    isDown = false;
                };

                const handleMouseMove = (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - table.offsetLeft;
                    const walk = (x - startX) * 2; // 스크롤 속도
                    table.scrollLeft = scrollLeft - walk;
                };

                table.addEventListener('mousedown', handleMouseDown);
                table.addEventListener('mouseleave', handleMouseLeave);
                table.addEventListener('mouseup', handleMouseUp);
                table.addEventListener('mousemove', handleMouseMove);

                return () => {
                    table.removeEventListener('mousedown', handleMouseDown);
                    table.removeEventListener('mouseleave', handleMouseLeave);
                    table.removeEventListener('mouseup', handleMouseUp);
                    table.removeEventListener('mousemove', handleMouseMove);
                };
            }, []);

            const getDaysInMonth = (date) => {
                return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            };

            const isWeekend = (date, day) => {
                const dayOfWeek = new Date(date.getFullYear(), date.getMonth(), day).getDay();
                return dayOfWeek === 0 || dayOfWeek === 6;
            };

            const isToday = (date, day) => {
                const today = new Date();
                return date.getFullYear() === today.getFullYear() &&
                       date.getMonth() === today.getMonth() &&
                       day === today.getDate();
            };

            const getDayName = (date, day) => {
                const dayOfWeek = new Date(date.getFullYear(), date.getMonth(), day).getDay();
                return ['일','월','화','수','목','금','토'][dayOfWeek];
            };

            const prevMonth = () => {
                setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
            };

            const nextMonth = () => {
                setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
            };

            const handleCellClick = (employeeId, day) => {
                // 모든 직원이 모든 일정을 수정할 수 있음
                const key = `${employeeId}-${currentDate.getFullYear()}-${currentDate.getMonth()}-${day}`;
                setSelectedCell({
                    employeeId,
                    day,
                    key,
                    existing: schedules[key] || null
                });
                setScheduleModalOpen(true);
            };

            const saveSchedule = (type, memo) => {
                if (!selectedCell) return;
                const newSchedules = { ...schedules };
                newSchedules[selectedCell.key] = { type, memo };
                setSchedules(newSchedules);
                
                // Firebase에 저장
                db.collection('schedules').doc(selectedCell.key).set({ type, memo });
                
                setScheduleModalOpen(false);
                setSelectedCell(null);
            };

            const deleteSchedule = () => {
                if (!selectedCell) return;
                const newSchedules = { ...schedules };
                delete newSchedules[selectedCell.key];
                setSchedules(newSchedules);
                
                // Firebase에서 삭제
                db.collection('schedules').doc(selectedCell.key).delete();
                
                setScheduleModalOpen(false);
                setSelectedCell(null);
            };

            const addEmployee = (newEmployee) => {
                const employee = {
                    id: employees.length + 1,
                    ...newEmployee,
                    role: 'user'
                };
                setEmployees([...employees, employee]);
                setEmployeeModalOpen(false);
            };

            const deleteEmployee = (employeeId) => {
                if (!confirm('이 직원을 삭제하시겠습니까?')) return;
                setEmployees(employees.filter(e => e.id !== employeeId));
                const newSchedules = { ...schedules };
                Object.keys(newSchedules).forEach(key => {
                    if (key.startsWith(`${employeeId}-`)) {
                        delete newSchedules[key];
                    }
                });
                setSchedules(newSchedules);
            };

            const moveEmployee = (index, direction) => {
                const newEmployees = [...employees];
                if (direction === 'up' && index > 0) {
                    [newEmployees[index], newEmployees[index - 1]] = [newEmployees[index - 1], newEmployees[index]];
                } else if (direction === 'down' && index < employees.length - 1) {
                    [newEmployees[index], newEmployees[index + 1]] = [newEmployees[index + 1], newEmployees[index]];
                }
                setEmployees(newEmployees);
            };

            const daysInMonth = getDaysInMonth(currentDate);
            const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

            return (
                <>
                    <div className="schedule-controls">
                        <div className="month-selector">
                            <button onClick={prevMonth}>◀ 이전 달</button>
                            <span>{currentDate.getFullYear()}년 {currentDate.getMonth() + 1}월</span>
                            <button onClick={nextMonth}>다음 달 ▶</button>
                        </div>

                        <div className="action-buttons">
                            {currentUser.role === 'admin' && (
                                <button 
                                    className="btn-add-employee"
                                    onClick={() => setEmployeeModalOpen(true)}
                                >
                                    + 직원 추가
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="scroll-hint">
                        💡 마우스로 드래그하거나 스크롤바를 움직여 날짜를 확인하세요
                    </div>

                    <div className="table-container" ref={tableRef}>
                        <table className="schedule-table">
                            <thead>
                                <tr>
                                    <th className="employee-name-header">직원명</th>
                                    {days.map(day => (
                                        <th 
                                            key={day} 
                                            className={`day-header ${isWeekend(currentDate, day) ? 'weekend' : ''}`}
                                        >
                                            <span className="day-number">{day}일</span>
                                            <span className="day-name">{getDayName(currentDate, day)}</span>
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {employees.map((employee, index) => (
                                    <tr key={employee.id}>
                                        <td className="employee-name">
                                            <div className="employee-info">
                                                <div className="employee-name-section">
                                                    <span className="employee-name-text">{employee.name}</span>
                                                    {currentUser.role === 'admin' && (
                                                        <div className="employee-order-btns">
                                                            <button 
                                                                className="order-btn"
                                                                onClick={() => moveEmployee(index, 'up')}
                                                                disabled={index === 0}
                                                                title="위로 이동"
                                                            >
                                                                ▲
                                                            </button>
                                                            <button 
                                                                className="order-btn"
                                                                onClick={() => moveEmployee(index, 'down')}
                                                                disabled={index === employees.length - 1}
                                                                title="아래로 이동"
                                                            >
                                                                ▼
                                                            </button>
                                                        </div>
                                                    )}
                                                </div>
                                                {currentUser.role === 'admin' && employee.id !== currentUser.id && (
                                                    <button 
                                                        className="employee-delete-btn"
                                                        onClick={() => deleteEmployee(employee.id)}
                                                    >
                                                        삭제
                                                    </button>
                                                )}
                                            </div>
                                        </td>
                                        {days.map(day => {
                                            const key = `${employee.id}-${currentDate.getFullYear()}-${currentDate.getMonth()}-${day}`;
                                            const schedule = schedules[key];
                                            const isTodayCell = isToday(currentDate, day);
                                            const isWeekendCell = isWeekend(currentDate, day);
                                            
                                            return (
                                                <td
                                                    key={day}
                                                    className={`day-cell ${isWeekendCell ? 'weekend' : ''} ${isTodayCell ? 'today' : ''}`}
                                                    onClick={() => handleCellClick(employee.id, day)}
                                                >
                                                    {schedule && (
                                                        <div className="schedule-content">
                                                            <span className={`schedule-badge schedule-${schedule.type}`}>
                                                                {schedule.type}
                                                            </span>
                                                            {schedule.memo && (
                                                                <div className="schedule-memo">
                                                                    {schedule.memo}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div className="legend">
                        <strong>일정 유형:</strong>
                        {scheduleTypes.map(type => (
                            <div key={type} className="legend-item">
                                <div className={`legend-color schedule-${type}`}></div>
                                <span>{type}</span>
                            </div>
                        ))}
                    </div>

                    <ScheduleModal
                        isOpen={scheduleModalOpen}
                        onClose={() => setScheduleModalOpen(false)}
                        onSave={saveSchedule}
                        onDelete={deleteSchedule}
                        selectedCell={selectedCell}
                        employees={employees}
                    />

                    <EmployeeModal
                        isOpen={employeeModalOpen}
                        onClose={() => setEmployeeModalOpen(false)}
                        onSave={addEmployee}
                    />
                </>
            );

        function FilesTab({ currentUser, sharedFiles, setSharedFiles }) {
            const files = sharedFiles; // 공유 파일 사용
            const setFiles = setSharedFiles; // 공유 파일 setter 사용
            const [selectedCategory, setSelectedCategory] = useState('전체');
            const [searchTerm, setSearchTerm] = useState('');
            const [isDragging, setIsDragging] = useState(false);
            const [uploadModalOpen, setUploadModalOpen] = useState(false);
            const [pendingFile, setPendingFile] = useState(null);
            const fileInputRef = useRef(null);

            const filteredFiles = files.filter(file => {
                const matchesCategory = selectedCategory === '전체' || file.category === selectedCategory;
                const matchesSearch = file.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    file.description.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            const handleFileSelect = (uploadedFiles) => {
                const file = uploadedFiles[0]; // 첫 번째 파일만 처리
                if (file) {
                    setPendingFile(file);
                    setUploadModalOpen(true);
                }
            };

            const handleFileUpload = (customName, category, description, dropboxLink) => {
                if (!pendingFile) return;
                
                const newFile = {
                    id: files.length + 1,
                    name: customName || pendingFile.name,
                    category: category || '기타',
                    size: formatFileSize(pendingFile.size),
                    uploadDate: new Date().toISOString().split('T')[0],
                    uploadedBy: currentUser.name,
                    description: description || '',
                    type: getFileType(pendingFile.name),
                    dropboxLink: dropboxLink || ''
                };
                setFiles(prev => [...prev, newFile]);
                
                // Firebase에 저장
                db.collection('files').doc(newFile.id.toString()).set(newFile);
                
                setPendingFile(null);
                setUploadModalOpen(false);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setIsDragging(true);
            };

            const handleDragLeave = () => {
                setIsDragging(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                handleFileSelect(e.dataTransfer.files);
            };

            const formatFileSize = (bytes) => {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            };

            const getFileType = (filename) => {
                const ext = filename.split('.').pop().toLowerCase();
                if (['pdf'].includes(ext)) return 'pdf';
                if (['doc', 'docx'].includes(ext)) return 'doc';
                if (['xls', 'xlsx'].includes(ext)) return 'xls';
                if (['jpg', 'jpeg', 'png', 'gif'].includes(ext)) return 'img';
                if (['zip', 'rar'].includes(ext)) return 'zip';
                return 'file';
            };

            const getFileIcon = (type) => {
                const icons = {
                    pdf: '📄',
                    doc: '📝',
                    xls: '📊',
                    img: '🖼️',
                    zip: '📦'
                };
                return icons[type] || '📎';
            };

            const handleDownload = (file) => {
                if (file.dropboxLink) {
                    // Dropbox 링크를 다운로드 모드로 변환
                    let downloadLink = file.dropboxLink;
                    
                    // Dropbox 공유 링크를 다운로드 링크로 변환
                    // www.dropbox.com → dl.dropboxusercontent.com
                    if (downloadLink.includes('dropbox.com')) {
                        downloadLink = downloadLink.replace('www.dropbox.com', 'dl.dropboxusercontent.com');
                        downloadLink = downloadLink.replace('?dl=0', '');
                        downloadLink = downloadLink.replace('?dl=1', '');
                    }
                    
                    // 새 탭에서 링크 열기
                    window.open(file.dropboxLink, '_blank');
                } else {
                    alert('파일 링크가 없습니다. 파일을 다시 등록해주세요.');
                }
            };

            const handleDelete = (fileId) => {
                if (confirm('정말 이 파일을 삭제하시겠습니까?')) {
                    setFiles(files.filter(f => f.id !== fileId));
                    
                    // Firebase에서 삭제
                    db.collection('files').doc(fileId.toString()).delete();
                }
            };

            return (
                <>
                    <div className="file-section">
                        <h2>📁 파일 업로드</h2>
                        <div 
                            className={`upload-area ${isDragging ? 'dragover' : ''}`}
                            onDragOver={handleDragOver}
                            onDragLeave={handleDragLeave}
                            onDrop={handleDrop}
                        >
                            <div style={{fontSize: '48px', marginBottom: '10px'}}>📤</div>
                            <p style={{marginBottom: '15px', color: '#7f8c8d'}}>
                                파일을 드래그하거나 클릭하여 업로드
                            </p>
                            <input
                                ref={fileInputRef}
                                type="file"
                                className="file-input"
                                onChange={(e) => handleFileSelect(e.target.files)}
                            />
                            <button 
                                className="upload-button"
                                onClick={() => fileInputRef.current.click()}
                            >
                                파일 선택
                            </button>
                        </div>
                    </div>

                    <div className="file-section">
                        <h2>📚 파일 목록</h2>
                        
                        <div className="search-box">
                            <input
                                type="text"
                                placeholder="파일명 또는 설명으로 검색..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                            />
                        </div>

                        <div className="category-filter">
                            {fileCategories.map(category => (
                                <button
                                    key={category}
                                    className={`category-btn ${selectedCategory === category ? 'active' : ''}`}
                                    onClick={() => setSelectedCategory(category)}
                                >
                                    {category}
                                </button>
                            ))}
                        </div>

                        {filteredFiles.length > 0 ? (
                            <div className="file-list">
                                {filteredFiles.map(file => (
                                    <div key={file.id} className="file-item">
                                        <div className="file-info">
                                            <div className={`file-icon ${file.type}`}>
                                                {getFileIcon(file.type)}
                                            </div>
                                            <div className="file-details">
                                                <div className="file-name">{file.name}</div>
                                                <div className="file-meta">
                                                    {file.size} · {file.uploadDate} · {file.uploadedBy}
                                                    {file.description && ` · ${file.description}`}
                                                </div>
                                                {file.dropboxLink && (
                                                    <div style={{
                                                        marginTop: '5px',
                                                        fontSize: '11px',
                                                        color: '#0061ff',
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        gap: '4px'
                                                    }}>
                                                        🔗 Dropbox 링크 연결됨
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        <div className="file-actions">
                                            <button 
                                                className="file-action-btn btn-download"
                                                onClick={() => handleDownload(file)}
                                            >
                                                다운로드
                                            </button>
                                            {(currentUser.role === 'admin' || file.uploadedBy === currentUser.name) && (
                                                <button 
                                                    className="file-action-btn btn-delete"
                                                    onClick={() => handleDelete(file.id)}
                                                >
                                                    삭제
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="empty-state">
                                <div className="empty-state-icon">📭</div>
                                <p>검색 결과가 없습니다</p>
                            </div>
                        )}
                    </div>

                    <FileUploadModal
                        isOpen={uploadModalOpen}
                        onClose={() => {
                            setUploadModalOpen(false);
                            setPendingFile(null);
                        }}
                        onSave={handleFileUpload}
                        fileName={pendingFile?.name || ''}
                    />
                </>
            );
        }

        function PasswordChangeTab({ currentUser, employees, updateEmployeePassword }) {
            const [currentPassword, setCurrentPassword] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [message, setMessage] = useState({ type: '', text: '' });

            const handlePasswordChange = () => {
                // 입력값 검증
                if (!currentPassword || !newPassword || !confirmPassword) {
                    setMessage({ type: 'error', text: '모든 필드를 입력해주세요.' });
                    return;
                }

                // 현재 비밀번호 확인
                const employee = employees.find(emp => emp.id === currentUser.id);
                if (employee.password !== currentPassword) {
                    setMessage({ type: 'error', text: '현재 비밀번호가 일치하지 않습니다.' });
                    return;
                }

                // 새 비밀번호 확인
                if (newPassword.length < 4) {
                    setMessage({ type: 'error', text: '새 비밀번호는 최소 4자 이상이어야 합니다.' });
                    return;
                }

                // 비밀번호 확인 일치 여부
                if (newPassword !== confirmPassword) {
                    setMessage({ type: 'error', text: '새 비밀번호가 일치하지 않습니다.' });
                    return;
                }

                // 비밀번호 변경
                updateEmployeePassword(currentUser.id, newPassword);
                setMessage({ type: 'success', text: '✓ 비밀번호가 성공적으로 변경되었습니다!' });
                
                // 입력 필드 초기화
                setCurrentPassword('');
                setNewPassword('');
                setConfirmPassword('');

            return (

                        🔑 비밀번호 변경

                                display: 'block',
                                marginBottom: '8px',
                                fontWeight: '600',
                                color: '#2c3e50',
                                fontSize: '14px'
                            }}>
                                현재 비밀번호 *
                            </label>
                            <input
                                type="password"
                                value={currentPassword}
                                onChange={(e) => {
                                    setCurrentPassword(e.target.value);
                                    setMessage({ type: '', text: '' });
                                }}
                                placeholder="현재 비밀번호를 입력하세요"
                                style={{
                                    width: '100%',
                                    padding: '12px',
                                    border: '2px solid #e0e0e0',
                                    borderRadius: '6px',
                                    fontSize: '14px',
                                    outline: 'none'
                                }}
                            />
                        </div>

                        <div style={{marginBottom: '20px'}}>
                            <label style={{
                                display: 'block',
                                marginBottom: '8px',
                                fontWeight: '600',
                                color: '#2c3e50',
                                fontSize: '14px'
                            }}>
                                새 비밀번호 *
                            </label>
                            <input
                                type="password"
                                value={newPassword}
                                onChange={(e) => {
                                    setNewPassword(e.target.value);
                                    setMessage({ type: '', text: '' });
                                }}
                                placeholder="새 비밀번호를 입력하세요 (최소 4자)"
                                style={{
                                    width: '100%',
                                    padding: '12px',
                                    border: '2px solid #e0e0e0',
                                    borderRadius: '6px',
                                    fontSize: '14px',
                                    outline: 'none'
                                }}
                            />
                        </div>

                        <div style={{marginBottom: '25px'}}>
                            <label style={{
                                display: 'block',
                                marginBottom: '8px',
                                fontWeight: '600',
                                color: '#2c3e50',
                                fontSize: '14px'
                            }}>
                                새 비밀번호 확인 *
                            </label>
                            <input

                                fontWeight: '600',
                                cursor: 'pointer',
                                transition: 'transform 0.2s'
                            }}
                            onMouseOver={(e) => e.target.style.transform = 'translateY(-2px)'}
                            onMouseOut={(e) => e.target.style.transform = 'translateY(0)'}
                        >
                            비밀번호 변경
                        </button>
                    </div>

                    <div style={{
                        marginTop: '20px',
                        padding: '15px',
                        background: '#fff3cd',
                        borderRadius: '6px',
                        border: '1px solid #ffc107'
                    }}>
                        <h4 style={{margin: '0 0 10px 0', color: '#856404'}}>⚠️ 비밀번호 변경 안내</h4>
                        <ul style={{
                            margin: 0,
                            paddingLeft: '20px',
                            color: '#856404',
                            fontSize: '13px',
                            lineHeight: '1.8'
                        }}>
                            <li>초기 비밀번호는 <strong>1234</strong>입니다.</li>
                            <li>비밀번호는 최소 4자 이상이어야 합니다.</li>
                            <li>보안을 위해 정기적으로 비밀번호를 변경하세요.</li>
                            <li>비밀번호는 안전하게 보관하세요.</li>
                        </ul>
                    </div>
                </div>
            );
        }

        function PermissionsTab({ diaryPermissions, setDiaryPermissions, employees, updateEmployeeRole }) {
            const togglePermission = (employeeId) => {
                setDiaryPermissions({
                    ...diaryPermissions,
                    [employeeId]: !diaryPermissions[employeeId]
                });
            };

            const toggleAdminRole = (employeeId) => {
                const employee = employees.find(e => e.id === employeeId);
                const newRole = employee.role === 'admin' ? 'user' : 'admin';
                
                // 관리자 권한을 회수하려는 경우
                if (newRole === 'user') {
                    // 현재 관리자가 몇 명인지 확인
                    const adminCount = employees.filter(e => e.role === 'admin').length;
                    
                    if (adminCount <= 1) {
                        alert('❌ 마지막 관리자입니다!\n\n최소 1명의 관리자는 반드시 유지되어야 합니다.\n다른 직원에게 먼저 관리자 권한을 부여한 후 회수하세요.');
                        return;
                    }
                    
                    if (confirm('정말 이 직원의 관리자 권한을 회수하시겠습니까?')) {
                        updateEmployeeRole(employeeId, newRole);
                    }
                } else if (newRole === 'admin' && confirm('이 직원에게 관리자 권한을 부여하시겠습니까?\n\n관리자는 모든 기능에 접근할 수 있습니다.')) {
                    updateEmployeeRole(employeeId, newRole);
                }
            };

            return (
                <div style={{padding: '20px'}}>
                    {/* 관리자 권한 관리 섹션 */}
                    <h2 style={{marginBottom: '10px', color: '#2c3e50'}}>
                        👑 관리자 권한 관리
                    </h2>
                    <p style={{marginBottom: '20px', color: '#7f8c8d', fontSize: '14px'}}>
                        직원에게 관리자 권한을 부여하거나 회수합니다. 관리자는 모든 기능에 접근할 수 있습니다.
                    </p>

                    <div style={{
                        background: 'white',
                        border: '2px solid #333',
                        borderRadius: '8px',
                        overflow: 'hidden',
                        marginBottom: '40px'
                    }}>
                        <table style={{
                            width: '100%',
                            borderCollapse: 'collapse'
                        }}>
                            <thead>
                                <tr style={{background: '#e67e22', color: 'white'}}>
                                    <th style={{padding: '15px', textAlign: 'left', fontSize: '15px', fontWeight: '600', borderRight: '1px solid #fff'}}>
                                        직원명
                                    </th>
                                    <th style={{padding: '15px', textAlign: 'left', fontSize: '15px', fontWeight: '600', borderRight: '1px solid #fff'}}>
                                        부서
                                    </th>
                                    <th style={{padding: '15px', textAlign: 'center', fontSize: '15px', fontWeight: '600', borderRight: '1px solid #fff'}}>
                                        현재 권한
                                    </th>
                                    <th style={{padding: '15px', textAlign: 'center', fontSize: '15px', fontWeight: '600'}}>
                                        관리자 권한
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                {employees.map((emp, index) => (
                                    <tr key={emp.id} style={{
                                        borderBottom: '1px solid #333',
                                        background: index % 2 === 0 ? '#f9f9f9' : 'white'
                                    }}>
                                        <td style={{padding: '15px', fontSize: '14px', fontWeight: '600', borderRight: '1px solid #333'}}>
                                            {emp.name}
                                        </td>
                                        <td style={{padding: '15px', fontSize: '14px', color: '#7f8c8d', borderRight: '1px solid #333'}}>
                                            {emp.department}
                                        </td>
                                        <td style={{padding: '15px', textAlign: 'center', borderRight: '1px solid #333'}}>
                                            <span style={{
                                                padding: '6px 12px',
                                                borderRadius: '4px',
                                                fontSize: '12px',
                                                fontWeight: '600',
                                                background: emp.role === 'admin' ? '#e67e22' : '#95a5a6',
                                                color: 'white'
                                            }}>
                                                {emp.role === 'admin' ? '👑 관리자' : '👤 일반'}
                                            </span>
                                        </td>
                                        <td style={{padding: '15px', textAlign: 'center'}}>
                                            <label style={{
                                                display: 'inline-flex',
                                                alignItems: 'center',
                                                cursor: 'pointer',
                                                gap: '8px'
                                            }}>
                                                <input
                                                    type="checkbox"
                                                    checked={emp.role === 'admin'}
                                                    onChange={() => toggleAdminRole(emp.id)}
                                                    style={{
                                                        width: '20px',
                                                        height: '20px',
                                                        cursor: 'pointer'
                                                    }}
                                                />
                                                <span style={{
                                                    fontSize: '14px',
                                                    fontWeight: '600',
                                                    color: emp.role === 'admin' ? '#e67e22' : '#95a5a6'
                                                }}>
                                                    {emp.role === 'admin' ? '✓ 관리자' : '일반 사용자'}
                                                </span>
                                            </label>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div style={{
                        marginBottom: '40px',
                        padding: '15px',
                        background: '#fff3cd',
                        borderRadius: '6px',
                        border: '1px solid #ffc107'
                    }}>
                        <h4 style={{margin: '0 0 10px 0', color: '#856404'}}>⚠️ 관리자 권한 안내</h4>
                        <ul style={{
                            margin: 0,
                            paddingLeft: '20px',
                            color: '#856404',
                            fontSize: '13px',
                            lineHeight: '1.8'
                        }}>
                            <li><strong>관리자는 모든 기능에 접근 가능:</strong> 일정, 업무일지, 파일, 권한 관리 등</li>
                            <li><strong>최소 1명의 관리자 필수:</strong> 마지막 관리자의 권한은 회수할 수 없습니다</li>
                            <li><strong>권한 회수 방법:</strong> 다른 직원에게 먼저 관리자 권한을 부여한 후 회수하세요</li>
                            <li><strong>즉시 반영:</strong> 권한 변경은 즉시 적용됩니다</li>
                        </ul>
                    </div>

                    <hr style={{border: 'none', borderTop: '2px solid #e0e0e0', margin: '40px 0'}} />

                    {/* 업무일지 조회 권한 관리 섹션 */}
                    <h2 style={{marginBottom: '10px', color: '#2c3e50'}}>
                        📋 업무일지 조회 권한 관리 (일반 직원용)
                    </h2>
                    <p style={{marginBottom: '20px', color: '#7f8c8d', fontSize: '14px'}}>
                        관리자가 아닌 일반 직원에게 모든 업무일지를 조회할 수 있는 권한만 부여합니다. (관리자는 기본적으로 모든 업무일지 조회 가능)
                    </p>

                    <div style={{
                        background: 'white',
                        border: '2px solid #333',
                        borderRadius: '8px',
                        overflow: 'hidden'
                    }}>
                        <table style={{
                            width: '100%',
                            borderCollapse: 'collapse'
                        }}>
                            <thead>
                                <tr style={{background: '#34495e', color: 'white'}}>
                                    <th style={{padding: '15px', textAlign: 'left', fontSize: '15px', fontWeight: '600', borderRight: '1px solid #fff'}}>
                                        직원명
                                    </th>
                                    <th style={{padding: '15px', textAlign: 'left', fontSize: '15px', fontWeight: '600', borderRight: '1px solid #fff'}}>
                                        부서
                                    </th>
                                    <th style={{padding: '15px', textAlign: 'center', fontSize: '15px', fontWeight: '600'}}>
                                        업무일지 조회 권한
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                {employees
                                    .filter(emp => emp.role !== 'admin') // 관리자는 제외 (기본적으로 모든 업무일지 조회 가능)
                                    .map((emp, index) => (
                                        <tr key={emp.id} style={{
                                            borderBottom: '1px solid #333',
                                            background: index % 2 === 0 ? '#f9f9f9' : 'white'
                                        }}>
                                            <td style={{padding: '15px', fontSize: '14px', fontWeight: '600', borderRight: '1px solid #333'}}>
                                                {emp.name}
                                            </td>
                                            <td style={{padding: '15px', fontSize: '14px', color: '#7f8c8d', borderRight: '1px solid #333'}}>
                                                {emp.department}
                                            </td>
                                            <td style={{padding: '15px', textAlign: 'center'}}>
                                                <label style={{
                                                    display: 'inline-flex',
                                                    alignItems: 'center',
                                                    cursor: 'pointer',
                                                    gap: '8px'
                                                }}>
                                                    <input
                                                        type="checkbox"
                                                        checked={diaryPermissions[emp.id] || false}
                                                        onChange={() => togglePermission(emp.id)}
                                                        style={{
                                                            width: '20px',
                                                            height: '20px',
                                                            cursor: 'pointer'
                                                        }}
                                                    />
                                                    <span style={{
                                                        fontSize: '14px',
                                                        fontWeight: '600',
                                                        color: diaryPermissions[emp.id] ? '#27ae60' : '#95a5a6'
                                                    }}>
                                                        {diaryPermissions[emp.id] ? '✓ 권한 있음' : '권한 없음'}
                                                    </span>
                                                </label>
                                            </td>
                                        </tr>
                                    ))}
                            </tbody>
                        </table>
                    </div>

                    <div style={{
                        marginTop: '20px',
                        padding: '15px',
                        background: '#e3f2fd',
                        borderRadius: '6px',
                        border: '1px solid #90caf9'
                    }}>
                        <h4 style={{margin: '0 0 10px 0', color: '#1976d2'}}>💡 업무일지 조회 권한 안내</h4>
                        <ul style={{
                            margin: 0,
                            paddingLeft: '20px',
                            color: '#424242',
                            fontSize: '13px',
                            lineHeight: '1.8'
                        }}>
                            <li><strong>관리자:</strong> 모든 기능 접근 가능 (일정, 업무일지, 파일, 권한 관리)</li>
                            <li><strong>업무일지 조회 권한:</strong> 업무일지만 전체 조회 가능 (관리자 기능 없음)</li>
                            <li><strong>일반 직원:</strong> 자신의 업무일지만 조회 가능</li>
                            <li>위 테이블에는 일반 직원만 표시됩니다 (관리자는 이미 모든 권한 보유)</li>
                            <li>권한 변경은 즉시 반영됩니다</li>
                        </ul>
                    </div>
                </div>
            );
        }

        function FileUploadModal({ isOpen, onClose, onSave, fileName }) {
            const [customName, setCustomName] = useState('');
            const [category, setCategory] = useState('기타');
            const [description, setDescription] = useState('');
            const [dropboxLink, setDropboxLink] = useState('');

            useEffect(() => {
                if (fileName) {
                    setCustomName(fileName.replace(/\.[^/.]+$/, '')); // 확장자 제거
                }
            }, [fileName]);

            const handleSave = () => {
                if (!customName.trim()) {
                    alert('파일 제목을 입력해주세요.');
                    return;
                }
                if (!dropboxLink.trim()) {
                    alert('Dropbox 링크를 입력해주세요.');
                    return;
                }
                const ext = fileName.match(/\.[^/.]+$/)?.[0] || '';
                onSave(customName + ext, category, description, dropboxLink);
                setCustomName('');
                setCategory('기타');
                setDescription('');
                setDropboxLink('');
            };

            return (
                <div className={`modal ${isOpen ? 'active' : ''}`} onClick={onClose}>
                    <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            파일 업로드
                        </div>
                        
                        <div className="form-group">
                            <label>파일 제목 *</label>
                            <input 
                                type="text" 
                                value={customName}
                                onChange={(e) => setCustomName(e.target.value)}
                                placeholder="파일 제목을 입력하세요"
                            />
                        </div>

                        <div className="form-group">
                            <label>카테고리 *</label>
                            <select value={category} onChange={(e) => setCategory(e.target.value)}>
                                {fileCategories.filter(c => c !== '전체').map(cat => (
                                    <option key={cat} value={cat}>{cat}</option>
                                ))}
                            </select>
                        </div>

                        <div className="form-group">
                            <label>Dropbox 링크 * 🔗</label>
                            <input 
                                type="url" 
                                value={dropboxLink}
                                onChange={(e) => setDropboxLink(e.target.value)}
                                placeholder="https://www.dropbox.com/..."
                                style={{
                                    fontFamily: 'monospace',
                                    fontSize: '13px'
                                }}
                            />
                            <small style={{
                                display: 'block',
                                marginTop: '5px',
                                color: '#7f8c8d',
                                fontSize: '12px'
                            }}>
                                💡 Dropbox에서 파일 우클릭 → 공유 → 링크 복사
                            </small>
                        </div>

                        <div className="form-group">
                            <label>설명 (선택)</label>
                            <textarea
                                value={description}
                                onChange={(e) => setDescription(e.target.value)}
                                placeholder="파일에 대한 설명을 입력하세요"
                                rows="3"
                            />
                        </div>

                        <div className="modal-buttons">
                            <button className="btn-save" onClick={handleSave}>
                                업로드
                            </button>
                            <button className="btn-cancel" onClick={onClose}>
                                취소
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Main />, document.getElementById('root'));
    </script>
</body>
</html>
