                    <h2 style={{marginBottom: '10px', color: '#2c3e50'}}>
                        👑 관리자 권한 관리
                    </h2>
                    <p style={{marginBottom: '20px', color: '#7f8c8d', fontSize: '14px'}}>
                        직원에게 관리자 권한을 부여하거나 회수합니다. 관리자는 모든 기능에 접근할 수 있습니다.
                    </p>

                    <div style={{
                        background: 'white',
                        border: '2px solid #333',
                        borderRadius: '8px',
                        overflow: 'hidden',
                        marginBottom: '40px'
                    }}>
                        <table style={{
                            width: '100%',
                            borderCollapse: 'collapse'
                        }}>
                            <thead>
                                <tr style={{background: '#e67e22', color: 'white'}}>
                                    <th style={{padding: '15px', textAlign: 'left', fontSize: '15px', fontWeight: '600', borderRight: '1px solid #fff'}}>
                                        직원명
                                    </th>
                                    <th style={{padding: '15px', textAlign: 'left', fontSize: '15px', fontWeight: '600', borderRight: '1px solid #fff'}}>
                                        부서
                                    </th>
                                    <th style={{padding: '15px', textAlign: 'center', fontSize: '15px', fontWeight: '600', borderRight: '1px solid #fff'}}>
                                        현재 권한
                                    </th>
                                    <th style={{padding: '15px', textAlign: 'center', fontSize: '15px', fontWeight: '600'}}>
                                        관리자 권한
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                {employees.map((emp, index) => (
                                    <tr key={emp.id} style={{
                                        borderBottom: '1px solid #333',
                                        background: index % 2 === 0 ? '#f9f9f9' : 'white'
                                    }}>
                                        <td style={{padding: '15px', fontSize: '14px', fontWeight: '600', borderRight: '1px solid #333'}}>
                                            {emp.name}
                                        </td>
                                        <td style={{padding: '15px', fontSize: '14px', color: '#7f8c8d', borderRight: '1px solid #333'}}>
                                            {emp.department}
                                        </td>
                                        <td style={{padding: '15px', textAlign: 'center', borderRight: '1px solid #333'}}>
                                            <span style={{
                                                padding: '6px 12px',
                                                borderRadius: '4px',
                                                fontSize: '12px',
                                                fontWeight: '600',
                                                background: emp.role === 'admin' ? '#e67e22' : '#95a5a6',
                                                color: 'white'
                                            }}>
                                                {emp.role === 'admin' ? '👑 관리자' : '👤 일반'}
                                            </span>

                                                fontSize: '12px',
                                                fontWeight: '600',
                                                background: emp.accountingAccess ? '#27ae60' : '#95a5a6',

                                                cursor: 'pointer',

                                                        width: '20px',
                                                        height: '20px',
                                                        cursor: 'pointer'
                                                    }}
                                                />
                                                <span style={{
                                                    fontSize: '14px',
                                                    fontWeight: '600',
                                                    color: emp.accountingAccess ? '#27ae60' : '#95a5a6'
                                                }}>
                                                    {emp.accountingAccess ? '✓ 권한 부여됨' : '권한 없음'}
                                                </span>
                                            </label>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div style={{
                        marginBottom: '40px',
                        padding: '15px',
                        background: '#fff3cd',
                        borderRadius: '6px',
                        border: '1px solid #ffc107'
                    }}>
                        <h4 style={{margin: '0 0 10px 0', color: '#856404'}}>⚠️ 관리자 권한 안내</h4>
                        <ul style={{
                            margin: 0,
                            paddingLeft: '20px',
                            color: '#856404',
                            fontSize: '13px',
                            lineHeight: '1.8'
                        }}>
                            <li><strong>관리자는 모든 기능에 접근 가능:</strong> 일정, 업무일지, 파일, 권한 관리 등</li>
                            <li><strong>최소 1명의 관리자 필수:</strong> 마지막 관리자의 권한은 회수할 수 없습니다</li>
                            <li><strong>권한 회수 방법:</strong> 다른 직원에게 먼저 관리자 권한을 부여한 후 회수하세요</li>
                            <li><strong>즉시 반영:</strong> 권한 변경은 즉시 적용됩니다</li>
                        </ul>
                    </div>

                    <hr style={{border: 'none', borderTop: '2px solid #e0e0e0', margin: '40px 0'}} />

                    {/* 업무일지 조회 권한 관리 섹션 */}
                    <h2 style={{marginBottom: '10px', color: '#2c3e50'}}>
                        📋 업무일지 조회 권한 관리 (일반 직원용)
                    </h2>
                    <p style={{marginBottom: '20px', color: '#7f8c8d', fontSize: '14px'}}>
                        관리자가 아닌 일반 직원에게 모든 업무일지를 조회할 수 있는 권한만 부여합니다. (관리자는 기본적으로 모든 업무일지 조회 가능)
                    </p>

                    <div style={{
                        background: 'white',
                        border: '2px solid #333',
                        borderRadius: '8px',
                        overflow: 'hidden'
                    }}>

                            width: '100%',
                            borderCollapse: 'collapse'
                        }}>
                            <thead>
                                <tr style={{background: '#34495e', color: 'white'}}>

                                        직원명
                                    </th>
                                    <th style={{padding: '15px', textAlign: 'left', fontSize: '15px', fontWeight: '600', borderRight: '1px solid #fff'}}>

                                        업무일지 조회 권한

                                </tr>
                            </thead>
                            <tbody>
                                {employees
                                    .filter(emp => emp.role !== 'admin') // 관리자는 제외 (기본적으로 모든 업무일지 조회 가능)

                                        <tr key={emp.id} style={{
                                            borderBottom: '1px solid #333',
                                            background: index % 2 === 0 ? '#f9f9f9' : 'white'
                                        }}>
                                            <td style={{padding: '15px', fontSize: '14px', fontWeight: '600', borderRight: '1px solid #333'}}>
                                                {emp.name}
                                            </td>
                                            <td style={{padding: '15px', fontSize: '14px', color: '#7f8c8d', borderRight: '1px solid #333'}}>
                                                {emp.department}
                                            </td>
                                            <td style={{padding: '15px', textAlign: 'center'}}>
                                                <label style={{
                                                    display: 'inline-flex',
                                                    alignItems: 'center',
                                                    cursor: 'pointer',
                                                    gap: '8px'
                                                }}>
                                                    <input
                                                        type="checkbox"
                                                        checked={diaryPermissions[emp.id] || false}
                                                        onChange={() => togglePermission(emp.id)}
                                                        style={{
                                                            width: '20px',
                                                            height: '20px',
                                                            cursor: 'pointer'
                                                        }}
                                                    />
                                                    <span style={{
                                                        fontSize: '14px',
                                                        fontWeight: '600',
                                                        color: diaryPermissions[emp.id] ? '#27ae60' : '#95a5a6'
                                                    }}>
                                                        {diaryPermissions[emp.id] ? '✓ 권한 있음' : '권한 없음'}
                                                    </span>
                                                </label>
                                            </td>
                                        </tr>
                                    ))}
                            </tbody>
                        </table>
                    </div>

                    <div style={{
                        marginTop: '20px',
                        padding: '15px',
                        background: '#e3f2fd',
                        borderRadius: '6px',
                        border: '1px solid #90caf9'
                    }}>
                        <h4 style={{margin: '0 0 10px 0', color: '#1976d2'}}>💡 업무일지 조회 권한 안내</h4>
                        <ul style={{
                            margin: 0,
                            paddingLeft: '20px',
                            color: '#424242',
                            fontSize: '13px',
                            lineHeight: '1.8'
                        }}>
                            <li><strong>관리자:</strong> 모든 기능 접근 가능 (일정, 업무일지, 파일, 권한 관리)</li>
                            <li><strong>업무일지 조회 권한:</strong> 업무일지만 전체 조회 가능 (관리자 기능 없음)</li>
                            <li><strong>일반 직원:</strong> 자신의 업무일지만 조회 가능</li>
                            <li>위 테이블에는 일반 직원만 표시됩니다 (관리자는 이미 모든 권한 보유)</li>
                            <li>권한 변경은 즉시 반영됩니다</li>
                        </ul>
                    </div>
                </div>
            );
        }

        function FileUploadModal({ isOpen, onClose, onSave, fileName }) {
            const [customName, setCustomName] = useState('');
            const [category, setCategory] = useState('기타');
            const [description, setDescription] = useState('');
            const [dropboxLink, setDropboxLink] = useState('');

            useEffect(() => {
                if (fileName) {
                    setCustomName(fileName.replace(/\.[^/.]+$/, '')); // 확장자 제거
                }
            }, [fileName]);

            const handleSave = () => {
                if (!customName.trim()) {
                    alert('파일 제목을 입력해주세요.');
                    return;
                }
                if (!dropboxLink.trim()) {
                    alert('Dropbox 링크를 입력해주세요.');
                    return;
                }
                const ext = fileName.match(/\.[^/.]+$/)?.[0] || '';
                onSave(customName + ext, category, description, dropboxLink);
                setCustomName('');
                setCategory('기타');
                setDescription('');
                setDropboxLink('');
            };

            return (
                <div className={`modal ${isOpen ? 'active' : ''}`} onClick={onClose}>
                    <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            파일 링크 등록
                        </div>
                        
                        <div className="form-group">
                            <label>파일 제목 *</label>
                            <input 
                                type="text" 
                                value={customName}
                                onChange={(e) => setCustomName(e.target.value)}
                                placeholder="예: ISO_9001_표준규격"
                            />
                        </div>

                        <div className="form-group">
                            <label>카테고리 *</label>
                            <select value={category} onChange={(e) => setCategory(e.target.value)}>
                                {fileCategories.filter(c => c !== '전체').map(cat => (
                                    <option key={cat} value={cat}>{cat}</option>
                                ))}
                            </select>
                        </div>

                        <div className="form-group">
                            <label>Dropbox 공유 링크 * 🔗</label>
                            <input 
                                type="url" 
                                value={dropboxLink}
                                onChange={(e) => setDropboxLink(e.target.value)}
                                placeholder="https://www.dropbox.com/..."
                                style={{
                                    fontFamily: 'monospace',
                                    fontSize: '13px'
                                }}
                            />
                            <small style={{
                                display: 'block',
                                marginTop: '8px',
                                color: '#2c3e50',
                                fontSize: '13px',
                                lineHeight: '1.6',
                                background: '#ecf0f1',
                                padding: '10px',
                                borderRadius: '4px'
                            }}>
                                <strong>📌 Dropbox 링크 가져오기:</strong><br/>
                                1. Dropbox에서 파일 우클릭<br/>
                                2. "공유" 또는 "Share" 클릭<br/>
                                3. "링크 복사" 클릭 후 여기에 붙여넣기
                            </small>
                        </div>

                        <div className="form-group">
                            <label>설명 (선택)</label>
                            <textarea
                                value={description}
                                onChange={(e) => setDescription(e.target.value)}
                                placeholder="파일에 대한 간단한 설명 (선택사항)"
                                rows="3"
                            />
                        </div>

                        <div className="modal-buttons">
                            <button className="btn-save" onClick={handleSave}>
                                등록
                            </button>
                            <button className="btn-cancel" onClick={onClose}>
                                취소
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Main />, document.getElementById('root'));
    </script>
</body>
</html>
